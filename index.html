<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Invitación Premium</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Allura&family=Cinzel:wght@400;500;600;700&family=Cormorant+Garamond:wght@400;500;600;700&family=Dancing+Script:wght@500;600;700&family=Forum&family=Great+Vibes&family=Jost:wght@300;400;500;600&family=Marcellus&family=Montserrat:wght@300;400;500;600;700&family=Parisienne&family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&family=Quicksand:wght@400;500;600;700&family=Raleway:wght@300;400;500;600&family=Sacramento&display=swap" rel="stylesheet">

<style>
:root {
  --bg: #fff8f4;
  --surface: #ffffff;
  --surface-soft: #f8ece9;
  --ink: #2d2426;
  --heading: #6f3b31;
  --muted: #7d696c;
  --accent: #b86f79;
  --accent-2: #d7a77f;
  --accent-3: #738c74;
  --button-bg: #2d2426;
  --button-text: #ffffff;
  --line: rgba(45, 36, 38, 0.16);
  --shadow: rgba(45, 36, 38, 0.16);
  --glow: rgba(184, 111, 121, 0.22);
  --title-font: "Cormorant Garamond", serif;
  --script-font: "Parisienne", cursive;
  --body-font: "Jost", sans-serif;
  --title-size: 3rem;
  --body-size: 1rem;
  --button-font-size: 0.78rem;
  --button-radius: 999px;
  --button-padding-y: 0.92rem;
  --button-padding-x: 1.25rem;
  --section-space: 5.5rem;
  --content-width: 1040px;
  --hero-image-size: 245px;
  --hero-y: 0px;
  --hero-x: 0px;
  --deco-scale: 1;
  --envelope-w: min(82vw, 430px);
  --envelope-h: 270px;
  --envelope-color: #f6dfd8;
  --envelope-lining: #fff7f2;
  --seal-color: #b86f79;
  --seal-text: #fffdf9;
  --radius: 8px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(120deg, rgba(255,255,255,0.72), transparent 34%),
    radial-gradient(circle at top left, var(--glow), transparent 30%),
    linear-gradient(180deg, var(--bg), var(--surface-soft));
  color: var(--ink);
  font-family: var(--body-font);
  font-size: var(--body-size);
  line-height: 1.65;
  overflow-x: hidden;
}

body.bloqueado {
  overflow: hidden;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

img {
  max-width: 100%;
  display: block;
}

.entrada {
  position: fixed;
  inset: 0;
  z-index: 9000;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(circle at 18% 16%, rgba(255,255,255,0.88), transparent 24%),
    radial-gradient(circle at 84% 72%, var(--glow), transparent 30%),
    linear-gradient(145deg, var(--bg), var(--surface-soft) 62%, var(--surface));
  transition: opacity 0.8s ease, visibility 0.8s ease;
}

.entrada.oculta {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.entrada-deco {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.entrada-deco .motif {
  position: absolute;
  width: calc(210px * var(--deco-scale));
  color: var(--accent);
  opacity: 0.15;
  animation: flotar 8s ease-in-out infinite;
}

.entrada-deco .motif:nth-child(1) {
  top: 7%;
  left: 5%;
  transform: rotate(-18deg);
}

.entrada-deco .motif:nth-child(2) {
  right: 3%;
  bottom: 6%;
  color: var(--accent-2);
  animation-delay: -3s;
  transform: rotate(14deg);
}

.sobre-wrap {
  width: min(560px, 100%);
  text-align: center;
  position: relative;
}

.sobre-copy {
  margin-bottom: 24px;
  opacity: 0;
  animation: subir 0.9s ease 0.25s forwards;
}

.sobre-copy .mini {
  margin: 0 0 6px;
  color: var(--accent);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

.sobre-copy h1 {
  margin: 0;
  font-family: var(--script-font);
  font-size: clamp(3rem, 14vw, 5.8rem);
  line-height: 0.9;
  color: var(--ink);
  font-weight: 400;
}

.sobre-copy p {
  margin: 12px auto 0;
  max-width: 360px;
  color: var(--muted);
}

.sobre {
  width: var(--envelope-w);
  height: var(--envelope-h);
  margin: 0 auto;
  position: relative;
  perspective: 1200px;
  filter: drop-shadow(0 26px 40px rgba(45, 36, 38, 0.24));
  animation: aparecerSobre 1s ease forwards;
}

.sobre-base,
.sobre-solapa,
.sobre-bolsillo,
.sobre-carta {
  position: absolute;
  inset: 0;
}

.sobre-base {
  border-radius: var(--radius);
  background:
    linear-gradient(145deg, rgba(255,255,255,0.42), transparent 34%),
    var(--envelope-color);
  border: 1px solid rgba(255,255,255,0.72);
}

.sobre-carta {
  width: 82%;
  height: 82%;
  left: 9%;
  top: 10%;
  border-radius: var(--radius);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.94), rgba(255,255,255,0.78)),
    var(--envelope-lining);
  border: 1px solid rgba(45,36,38,0.08);
  display: grid;
  place-items: center;
  padding: 24px;
  transform: translateY(10px);
  transition: transform 1s ease 0.22s;
  z-index: 4;
}

.sobre-carta span {
  display: block;
  font-family: var(--title-font);
  font-size: clamp(1.8rem, 9vw, 3rem);
  line-height: 1;
  color: var(--accent);
}

.sobre-carta small {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.sobre-solapa {
  clip-path: polygon(0 0, 100% 0, 50% 62%);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.52), transparent 54%),
    var(--envelope-color);
  border-radius: var(--radius);
  transform-origin: top center;
  transition: transform 0.95s cubic-bezier(.2,.72,.18,1), filter 0.95s ease;
  z-index: 5;
}

.sobre-bolsillo {
  z-index: 7;
}

.sobre-bolsillo::before,
.sobre-bolsillo::after {
  content: "";
  position: absolute;
  bottom: 0;
  width: 50.5%;
  height: 100%;
  background: var(--envelope-color);
}

.sobre-bolsillo::before {
  left: 0;
  clip-path: polygon(0 20%, 100% 57%, 100% 100%, 0 100%);
  border-bottom-left-radius: var(--radius);
}

.sobre-bolsillo::after {
  right: 0;
  clip-path: polygon(100% 20%, 0 57%, 0 100%, 100% 100%);
  border-bottom-right-radius: var(--radius);
}

.sello {
  position: absolute;
  z-index: 8;
  left: 50%;
  top: 54%;
  transform: translate(-50%, -50%);
  width: 92px;
  height: 92px;
  border: 0;
  border-radius: 50%;
  color: var(--seal-text);
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,0.36), transparent 24%),
    var(--seal-color);
  box-shadow:
    0 14px 26px rgba(45,36,38,0.22),
    inset 0 0 0 1px rgba(255,255,255,0.32),
    inset 0 0 0 8px rgba(255,255,255,0.08);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-family: var(--title-font);
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transition: transform 0.25s ease, filter 0.25s ease;
}

.sello:hover {
  transform: translate(-50%, -50%) scale(1.04);
  filter: brightness(1.04);
}

.sobre.abierto .sobre-solapa {
  transform: rotateX(-180deg);
  filter: brightness(1.06);
  z-index: 1;
}

.sobre.abierto .sobre-carta {
  z-index: 6;
  transform: translateY(-138px);
}

.sobre.abierto .sello {
  transform: translate(-50%, -50%) scale(0.75);
  opacity: 0;
  pointer-events: none;
}

.app {
  min-height: 100vh;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.8s ease;
}

.app.visible {
  opacity: 1;
  visibility: visible;
}

.music-control {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 5000;
  width: 50px;
  height: 50px;
  border: 1px solid rgba(255,255,255,0.72);
  border-radius: 50%;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  color: var(--accent);
  box-shadow: 0 14px 36px var(--shadow);
  display: grid;
  place-items: center;
  cursor: pointer;
  backdrop-filter: blur(16px);
}

.music-control svg {
  width: 22px;
  height: 22px;
}

.music-control.reproduciendo {
  color: var(--button-text);
  background: var(--button-bg);
}

.hero {
  position: relative;
  min-height: 96svh;
  padding: 48px 18px 82px;
  display: grid;
  align-items: center;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--surface) 75%, transparent) 0 44%, transparent 44%),
    radial-gradient(circle at 78% 18%, var(--glow), transparent 28%);
  pointer-events: none;
}

.hero-grid {
  position: relative;
  z-index: 2;
  width: min(var(--content-width), 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 0.92fr 1.08fr;
  gap: clamp(28px, 6vw, 72px);
  align-items: center;
  transform: translate(var(--hero-x), var(--hero-y));
}

.portrait-stage {
  min-height: 470px;
  position: relative;
  display: grid;
  place-items: center;
}

.portrait-ring {
  width: min(var(--hero-image-size), 72vw);
  aspect-ratio: 1;
  border-radius: 50%;
  padding: 10px;
  background:
    conic-gradient(from 90deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
  box-shadow: 0 28px 58px var(--shadow);
  position: relative;
  z-index: 2;
}

.portrait-ring::before {
  content: "";
  position: absolute;
  inset: -36px;
  border: 1px solid var(--line);
  border-radius: 46% 54% 50% 50%;
  transform: rotate(-12deg);
}

.portrait-ring::after {
  content: "";
  position: absolute;
  inset: -70px -48px;
  border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent);
  border-radius: 55% 45% 46% 54%;
  transform: rotate(18deg);
}

.portrait-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--surface)), var(--surface-soft));
  border: 8px solid var(--surface);
}

.portrait-img[src=""] {
  display: none;
}

.portrait-fallback {
  position: absolute;
  inset: 18px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 26px;
  background:
    radial-gradient(circle at 30% 24%, rgba(255,255,255,0.82), transparent 34%),
    linear-gradient(135deg, var(--surface), var(--surface-soft));
  color: var(--accent);
  font-family: var(--script-font);
  font-size: clamp(4.8rem, 12vw, 7.2rem);
  line-height: 0.82;
}

.portrait-deco {
  position: absolute;
  width: calc(190px * var(--deco-scale));
  color: var(--accent);
  opacity: 0.95;
  pointer-events: none;
  z-index: 3;
}

.portrait-deco.deco-a {
  top: -30px;
  right: -50px;
  animation: flotar 6.5s ease-in-out infinite;
}

.portrait-deco.deco-b {
  left: -50px;
  bottom: -20px;
  width: calc(150px * var(--deco-scale));
  color: var(--accent-2);
  animation: flotar 7.4s ease-in-out -2s infinite;
  transform: rotate(-10deg);
}

.hero-copy {
  position: relative;
  padding-left: clamp(0px, 2vw, 30px);
}

.eyebrow {
  margin: 0 0 12px;
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

.nombre {
  margin: 0;
  font-family: var(--script-font);
  font-size: clamp(4.2rem, 13vw, 8.2rem);
  line-height: 0.82;
  color: var(--ink);
  font-weight: 400;
}

.subtitulo {
  margin: 18px 0 0;
  font-family: var(--title-font);
  font-size: clamp(1.8rem, 4.4vw, 3.2rem);
  line-height: 1;
  color: var(--accent);
}

.hero-text {
  width: min(570px, 100%);
  margin: 24px 0 0;
  color: var(--muted);
  font-size: clamp(1rem, 2.5vw, 1.16rem);
}

.hero-actions,
.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  margin-top: 28px;
}

.btn {
  border: 1px solid color-mix(in srgb, var(--button-bg) 12%, transparent);
  border-radius: var(--button-radius);
  padding: var(--button-padding-y) var(--button-padding-x);
  min-height: 45px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  background: var(--button-bg);
  color: var(--button-text);
  box-shadow: 0 13px 30px color-mix(in srgb, var(--button-bg) 20%, transparent);
  cursor: pointer;
  text-decoration: none;
  font-family: var(--body-font);
  font-size: var(--button-font-size);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
}

.btn svg {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
}

.btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.05);
  box-shadow: 0 17px 36px color-mix(in srgb, var(--button-bg) 24%, transparent);
}

.btn.secundario {
  color: var(--ink);
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  border-color: var(--line);
  box-shadow: none;
}

.scroll-mark {
  position: absolute;
  left: 50%;
  bottom: 24px;
  z-index: 3;
  color: var(--accent);
  transform: translateX(-50%);
  animation: bounce 1.7s infinite;
}

.section {
  position: relative;
  padding: var(--section-space) 18px;
  overflow: hidden;
}

.section:nth-of-type(odd) {
  background: color-mix(in srgb, var(--surface) 78%, var(--bg));
}

.section-inner {
  width: min(var(--content-width), 100%);
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.section-head {
  max-width: 690px;
  margin-bottom: 32px;
}

.section-kicker {
  margin: 0 0 10px;
  color: var(--accent);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

h2 {
  margin: 0;
  font-family: var(--title-font);
  font-size: clamp(2.45rem, 7vw, var(--title-size));
  line-height: 0.98;
  color: var(--heading);
  font-weight: 600;
}

.lead {
  margin: 18px 0 0;
  color: var(--muted);
  font-size: clamp(1rem, 2.5vw, 1.13rem);
}

.story {
  display: grid;
  grid-template-columns: 0.85fr 1.15fr;
  gap: clamp(24px, 6vw, 60px);
  align-items: center;
}

.story-panel {
  border-left: 1px solid var(--line);
  padding-left: clamp(22px, 4vw, 42px);
}

.countdown-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 26px;
}

.count-item,
.event-item,
.detail-item {
  background: color-mix(in srgb, var(--surface) 84%, transparent);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 18px 42px var(--shadow);
}

.count-item {
  min-height: 126px;
  padding: 20px 10px;
  display: grid;
  place-items: center;
  text-align: center;
}

.count-num {
  display: block;
  font-family: var(--title-font);
  font-size: clamp(2rem, 8vw, 4rem);
  line-height: 0.9;
  color: var(--accent);
}

.count-label {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.event-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.event-item {
  padding: clamp(24px, 5vw, 36px);
  min-height: 260px;
  position: relative;
  overflow: hidden;
}

.event-item::after {
  content: "";
  position: absolute;
  right: -42px;
  bottom: -42px;
  width: 150px;
  height: 150px;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  border-radius: 50%;
}

.event-title {
  margin: 0 0 18px;
  font-family: var(--title-font);
  font-size: clamp(2rem, 6vw, 3.1rem);
  color: var(--heading);
  line-height: 1;
}

.event-data {
  margin: 0 0 8px;
  color: var(--ink);
  font-weight: 600;
}

.event-address {
  margin: 0;
  color: var(--muted);
}

.detail-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 24px;
}

.detail-item {
  flex: 1 1 300px;
  max-width: 420px;
  min-height: 240px;
  padding: 28px;
}

.detail-icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin-bottom: 18px;
  background: color-mix(in srgb, var(--accent) 14%, var(--surface));
  color: var(--accent);
}

.detail-icon svg {
  width: 23px;
  height: 23px;
}

.detail-item h3 {
  margin: 0 0 10px;
  font-family: var(--title-font);
  font-size: 2rem;
  line-height: 1;
  color: var(--heading);
}

.detail-item p {
  margin: 0;
  color: var(--muted);
}

.carousel-shell {
  position: relative;
}

.carousel {
  position: relative;
  overflow: hidden;
  border-radius: var(--radius);
  border: 1px solid var(--line);
  background: var(--surface);
  box-shadow: 0 24px 58px var(--shadow);
}

.carousel-track {
  display: flex;
  transition: transform 0.65s cubic-bezier(.2,.7,.2,1);
}

.slide {
  min-width: 100%;
  height: min(68vh, 620px);
  position: relative;
  background: var(--surface-soft);
  overflow: hidden;
}

.slide img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.placeholder-photo {
  height: 100%;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 28px;
  color: var(--accent);
  background:
    radial-gradient(circle at 35% 25%, rgba(255,255,255,0.78), transparent 28%),
    linear-gradient(145deg, color-mix(in srgb, var(--accent) 18%, var(--surface)), var(--surface-soft));
  font-family: var(--title-font);
  font-size: clamp(2rem, 8vw, 4.2rem);
}

.carousel-btn {
  position: absolute;
  top: 50%;
  z-index: 3;
  width: 48px;
  height: 48px;
  border: 1px solid rgba(255,255,255,0.68);
  border-radius: 50%;
  background: rgba(255,255,255,0.84);
  color: var(--ink);
  display: grid;
  place-items: center;
  cursor: pointer;
  transform: translateY(-50%);
  box-shadow: 0 12px 26px rgba(0,0,0,0.18);
}

.carousel-btn svg {
  width: 22px;
  height: 22px;
}

.carousel-btn.prev {
  left: 16px;
}

.carousel-btn.next {
  right: 16px;
}

.dots {
  display: flex;
  justify-content: center;
  gap: 8px;
  margin-top: 18px;
}

.dots button {
  width: 8px;
  height: 8px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: color-mix(in srgb, var(--accent) 28%, var(--surface));
  cursor: pointer;
}

.dots button.activo {
  width: 30px;
  border-radius: 999px;
  background: var(--accent);
}

.closing {
  min-height: 72vh;
  display: grid;
  align-items: center;
  text-align: center;
  background:
    radial-gradient(circle at 50% 20%, var(--glow), transparent 36%),
    linear-gradient(180deg, var(--surface), var(--bg));
}

.closing h2 {
  font-family: var(--script-font);
  font-weight: 400;
  color: var(--heading);
  font-size: clamp(3.6rem, 13vw, 7.4rem);
}

.closing .lead {
  margin-left: auto;
  margin-right: auto;
  max-width: 650px;
}

.deco-corner {
  position: absolute;
  pointer-events: none;
  width: calc(260px * var(--deco-scale));
  color: var(--accent);
  opacity: 0.11;
}

.deco-corner.left {
  left: -70px;
  top: 26px;
  transform: rotate(-14deg);
}

.deco-corner.right {

  musica: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>`,
  vestir: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20.38 3.46L16 2a8.9 8.9 0 0 1-3.36 2.94 8.9 8.9 0 0 1-5.28 0L3.62 3.46 2 8l4 2v12h12V10l4-2-1.62-4.54z"/></svg>`,
  regalo: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><polyline points="20 12 20 22 4 22 4 12"/><rect x="2" y="7" width="20" height="5"/><line x1="12" y1="22" x2="12" y2="7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>`,
  evento: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>`,
  flecha: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M5 12h14M12 5l7 7-7 7"/></svg>`,
  camara: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>`
};

const MOTIVOS = {
  mariposas: `<svg viewBox="0 0 220 220" fill="none" aria-hidden="true"><path d="M110 108c-31-57-80-70-94-38-10 23 15 58 73 55" fill="currentColor" opacity=".30" stroke="currentColor" stroke-width="3"/><path d="M110 108c31-57 80-70 94-38 10 23-15 58-73 55" fill="currentColor" opacity=".30" stroke="currentColor" stroke-width="3"/><path d="M105 117c-38 13-56 44-38 63 17 18 43 0 45-51" fill="currentColor" opacity=".24" stroke="currentColor" stroke-width="3"/><path d="M115 117c38 13 56 44 38 63-17 18-43 0-45-51" fill="currentColor" opacity=".24" stroke="currentColor" stroke-width="3"/><path d="M110 92v58" stroke="currentColor" stroke-width="4" stroke-linecap="round"/><path d="M102 84c-10-13-20-19-32-22M118 84c10-13 20-19 32-22" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>`,
  flores: `<svg viewBox="0 0 220 220" fill="none" aria-hidden="true"><path d="M110 110c-40-60-90-20-90 20s50 80 90 20" fill="currentColor" opacity=".2" stroke="currentColor" stroke-width="3"/><path d="M110 110c40-60 90-20 90 20s-50 80-90 20" fill="currentColor" opacity=".2" stroke="currentColor" stroke-width="3"/><circle cx="110" cy="110" r="16" fill="var(--surface)" stroke="currentColor" stroke-width="4"/><path d="M110 126v50M90 150c20-20 40 20 40 20" stroke="currentColor" stroke-width="4" stroke-linecap="round"/></svg>`
};

let currentSlide = 0;
let autoPlay;
let slidesCount = 0;

function textoSeguro(texto) {
  if (!texto) return "";
  const d = document.createElement("div");
  d.textContent = texto;
  return d.innerHTML;
}

function setText(id, texto) {
  const el = document.getElementById(id);
  if (el) el.textContent = texto;
}

function setLink(id, props) {
  const el = document.getElementById(id);
  if (el) {
    if (props.href) el.href = props.href;
    if (props.text) el.innerHTML = props.text;
    if (props.target) el.target = props.target;
    if (props.rel) el.rel = props.rel;
  }
}

function aplicarDiseno() {
  const paleta = CONFIG.diseno;
  const root = document.documentElement;

  root.style.setProperty("--bg", paleta.colorFondo);
  root.style.setProperty("--envelope-color", paleta.colorSobre);
  root.style.setProperty("--seal-color", paleta.colorLacre);
  root.style.setProperty("--seal-text", paleta.colorTextoLacre);
  root.style.setProperty("--accent", paleta.colorPrimario);
  root.style.setProperty("--accent-2", paleta.colorSecundario);
  root.style.setProperty("--accent-3", paleta.colorTerciario);
  root.style.setProperty("--ink", paleta.colorOscuro);
  root.style.setProperty("--heading", paleta.colorTitulo);
  root.style.setProperty("--muted", paleta.colorTexto);
  root.style.setProperty("--surface", paleta.colorSuperficie);
  root.style.setProperty("--surface-soft", paleta.colorSuperficieSuave);
  root.style.setProperty("--button-bg", paleta.colorOscuro);
  root.style.setProperty("--button-text", paleta.colorSuperficie);

  const rgbAccent = hexToRgb(paleta.colorPrimario);
  if (rgbAccent) {
    root.style.setProperty("--glow", `rgba(${rgbAccent}, 0.22)`);
  }
}

function hexToRgb(hex) {
  const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
  return result ? `${parseInt(result[1], 16)}, ${parseInt(result[2], 16)}, ${parseInt(result[3], 16)}` : null;
}

function renderizarMotivos() {
  const motivoHTML = MOTIVOS[CONFIG.diseno.motivo] || MOTIVOS.mariposas;
  document.querySelectorAll("[data-motif]").forEach(el => el.innerHTML = motivoHTML);
  document.querySelectorAll("[data-motif-small]").forEach(el => {
    el.innerHTML = motivoHTML;
    el.style.setProperty("--deco-scale", "0.75");
  });
}

function armarEntrada() {
  setText("entradaMini", CONFIG.evento.tipo);
  setText("entradaNombre", CONFIG.evento.nombre);
  setText("entradaTexto", CONFIG.evento.frase);
  setText("sobreInicial", CONFIG.evento.nombreCorto);
  setText("sobreFecha", CONFIG.evento.fechaTexto);
}

function armarHero() {
  const cover = document.getElementById("coverImage");
  const fallback = document.getElementById("coverFallback");
  
  if (CONFIG.diseno.fotoPrincipal) {
    cover.src = textoSeguro(CONFIG.diseno.fotoPrincipal);
    cover.style.display = "block";
    fallback.style.display = "none";
  } else {
    cover.style.display = "none";
    fallback.style.display = "grid";
    fallback.textContent = textoSeguro(CONFIG.evento.nombreCorto);
  }

  setText("heroEyebrow", CONFIG.textos.heroKicker);
  setText("heroName", CONFIG.evento.nombre);
  setText("heroSubtitle", CONFIG.evento.fechaTexto);
  setText("heroText", CONFIG.evento.frase);
  setLink("heroPrimary", { text: `<span>${textoSeguro(CONFIG.textos.heroBtnPrincipal)}</span>${ICONOS.flecha}` });
  setLink("heroSecondary", { text: `<span>${textoSeguro(CONFIG.textos.heroBtnSecundario)}</span>` });
}

function armarSecciones() {
  setText("storyKicker", CONFIG.textos.historiaKicker);
  setText("storyTitle", CONFIG.textos.historiaTitulo);
  setText("storyText", CONFIG.textos.historiaTexto);

  setText("countKicker", CONFIG.textos.cuentaKicker);
  setText("countTitle", CONFIG.textos.cuentaTitulo);
  setText("countText", CONFIG.textos.cuentaTexto);

  setText("eventKicker", CONFIG.textos.eventoKicker);
  setText("eventTitle", CONFIG.textos.eventoTitulo);
  setText("eventText", CONFIG.textos.eventoTexto);

  setText("galleryKicker", CONFIG.textos.galeriaKicker);
  setText("galleryTitle", CONFIG.textos.galeriaTitulo);
  setText("galleryText", CONFIG.textos.galeriaTexto);

  setText("footerName", CONFIG.evento.nombre);
  setText("footerText", "¡Los esperamos!");
}

function crearEventos() {
  const grid = document.getElementById("eventGrid");
  if (!CONFIG.eventos || !CONFIG.eventos.length) {
    document.getElementById("evento").hidden = true;
    return;
  }

  grid.innerHTML = "";
  CONFIG.eventos.forEach(lugar => {
    const item = document.createElement("div");
    item.className = "event-item";
    item.innerHTML = `
      <div class="detail-icon" style="margin-bottom: 18px;">${ICONOS.evento}</div>
      <h3 class="event-title">${textoSeguro(lugar.titulo)}</h3>
      <p class="event-data">${textoSeguro(lugar.fecha)} · ${textoSeguro(lugar.hora)}</p>
      <p class="event-data">${textoSeguro(lugar.lugar)}</p>
      <p class="event-address">${textoSeguro(lugar.direccion)}</p>
      <div class="button-row">
        <a class="btn secundario" href="${textoSeguro(lugar.mapa)}" target="_blank" rel="noopener">${ICONOS.mapa}<span>Ver ubicación</span></a>
      </div>`;
    grid.appendChild(item);
  });
}

function crearDetalles() {
  const d = CONFIG.detalles;

  const dresscodeSec = document.getElementById("dresscode");
  const dresscodeGrid = document.getElementById("gridDresscode");
  if (d.dresscode && d.dresscode.activo) {
    dresscodeGrid.innerHTML = `
      <article class="detail-item">
        <div class="detail-icon">${ICONOS.vestir}</div>
        <h3>${textoSeguro(d.dresscode.titulo)}</h3>
        <p>${textoSeguro(d.dresscode.texto)}</p>
      </article>`;
  } else {
    dresscodeSec.hidden = true;
  }

  const asistenciaSec = document.getElementById("asistencia");
  const asistenciaGrid = document.getElementById("gridAsistencia");
  if ((d.asistencia && d.asistencia.activo) || (d.album && d.album.activo)) {
    let html = "";
    if (d.asistencia && d.asistencia.activo) {
      const wappUrl = `[https://wa.me/$](https://wa.me/$){d.asistencia.whatsapp}?text=${encodeURIComponent("¡Hola! Confirmo mi asistencia.")}`;
      html += `
        <article class="detail-item">
          <div class="detail-icon">${ICONOS.whatsapp}</div>
          <h3>${textoSeguro(d.asistencia.titulo)}</h3>
          <p>${textoSeguro(d.asistencia.texto)}</p>
          <div class="button-row">
            <a class="btn secundario" href="${wappUrl}" target="_blank" rel="noopener">${ICONOS.whatsapp}<span>Confirmar por WhatsApp</span></a>
          </div>
        </article>`;
    }
    if (d.album && d.album.activo) {
      html += `
        <article class="detail-item">
          <div class="detail-icon">${ICONOS.camara}</div>
          <h3>${textoSeguro(d.album.titulo)}</h3>
          <p>${textoSeguro(d.album.texto)}</p>
          <div class="button-row">
            <a class="btn secundario" href="${textoSeguro(d.album.enlace)}" target="_blank" rel="noopener">${ICONOS.camara}<span>Ver Álbum</span></a>
          </div>
        </article>`;
    }
    asistenciaGrid.innerHTML = html;
  } else {
    asistenciaSec.hidden = true;
  }

  const regalosSec = document.getElementById("regalos");
  const regalosGrid = document.getElementById("gridRegalos");
  if (d.regalos && d.regalos.activo) {
    regalosGrid.innerHTML = `
      <article class="detail-item">
        <div class="detail-icon">${ICONOS.regalo}</div>
        <h3>${textoSeguro(d.regalos.titulo)}</h3>
        <p>${textoSeguro(d.regalos.texto)}</p>
        <div class="button-row">
          <button class="btn secundario" id="btnRegalo" type="button">${ICONOS.regalo}<span>Ver Datos Bancarios</span></button>
        </div>
      </article>`;
    
    setText("modalGiftText", d.regalos.texto);
    const b = d.regalos.banco;
    const modalData = document.getElementById("modalGiftData");
    modalData.innerHTML = "";
    if (b) {
      const campos = [
        { l: "Titular", v: b.titular },
        { l: "Banco", v: b.banco },
        { l: "CBU/CVU", v: b.cbu },
        { l: "Alias", v: b.alias }
      ];
      campos.forEach(c => {
        if (c.v) {
          modalData.innerHTML += `
            <div class="gift-row" onclick="copiarAlPortapapeles('${textoSeguro(c.v)}')">
              <span class="gift-label">${textoSeguro(c.l)}</span>
              <span class="gift-value">${textoSeguro(c.v)}</span>
            </div>`;
        }
      });
    }

    document.getElementById("btnRegalo").addEventListener("click", () => {
      document.getElementById("giftModal").classList.add("visible");
      document.body.style.overflow = "hidden";
    });

  } else {
    regalosSec.hidden = true;
  }
}

function crearGaleria() {
  const track = document.getElementById("carouselTrack");
  const dotsContainer = document.getElementById("carouselDots");
  const fotos = CONFIG.diseno.galeria;

  if (!fotos || fotos.length === 0) {
    document.getElementById("galeria").hidden = true;
    return;
  }

  slidesCount = fotos.length;
  track.innerHTML = "";
  dotsContainer.innerHTML = "";

  fotos.forEach((foto, index) => {
    const slide = document.createElement("div");
    slide.className = "slide";
    slide.innerHTML = `
      <img src="${textoSeguro(foto)}" alt="Foto" loading="${index === 0 ? "eager" : "lazy"}">
      <div class="placeholder-photo" hidden>${textoSeguro(CONFIG.evento.nombreCorto)}</div>`;
    track.appendChild(slide);

    const img = slide.querySelector("img");
    img.addEventListener("click", () => abrirLightbox(foto));
    img.addEventListener("error", () => {
      img.hidden = true;
      slide.querySelector(".placeholder-photo").hidden = false;
    });

    const dot = document.createElement("button");
    dot.type = "button";
    dot.setAttribute("aria-label", `Ir a foto ${index + 1}`);
    if (index === 0) dot.className = "activo";
    dot.addEventListener("click", () => irASlide(index));
    dotsContainer.appendChild(dot);
  });
}

function actualizarCarrusel() {
  const track = document.getElementById("carouselTrack");
  track.style.transform = `translateX(-${currentSlide * 100}%)`;
  
  const dots = document.querySelectorAll(".dots button");
  dots.forEach((dot, i) => {
    dot.classList.toggle("activo", i === currentSlide);
  });
}

function irASlide(index) {
  currentSlide = index;
  actualizarCarrusel();
  resetAutoPlay();
}

function sigSlide() {
  currentSlide = (currentSlide + 1) % slidesCount;
  actualizarCarrusel();
}

function prevSlide() {
  currentSlide = (currentSlide - 1 + slidesCount) % slidesCount;
  actualizarCarrusel();
}

function resetAutoPlay() {
  clearInterval(autoPlay);
  autoPlay = setInterval(sigSlide, 4500);
}

function iniciarCuenta() {
  const target = new Date(CONFIG.evento.fecha).getTime();
  
  function update() {
    const now = new Date().getTime();
    const diff = target - now;

    if (diff < 0) {
      setText("days", "00");
      setText("hours", "00");
      setText("minutes", "00");
      setText("seconds", "00");
      return;
    }

    const d = Math.floor(diff / (1000 * 60 * 60 * 24));
    const h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const s = Math.floor((diff % (1000 * 60)) / 1000);

    setText("days", String(d).padStart(2, "0"));
    setText("hours", String(h).padStart(2, "0"));
    setText("minutes", String(m).padStart(2, "0"));
    setText("seconds", String(s).padStart(2, "0"));
  }

  update();
  setInterval(update, 1000);
}

function setupMusica() {
  const audio = document.getElementById("musica");
  const btn = document.getElementById("musicControl");

  if (CONFIG.evento.musica) {
    audio.src = CONFIG.evento.musica;
  }

  btn.innerHTML = ICONOS.musica;
  
  btn.addEventListener("click", () => {
    if (audio.paused) {
      audio.play().catch(() => console.log("Bloqueado por el navegador"));
      btn.classList.add("reproduciendo");
    } else {
      audio.pause();
      btn.classList.remove("reproduciendo");
    }
  });
}

function abrirInvitacion() {
  const sobre = document.getElementById("sobre");
  const entrada = document.getElementById("entrada");
  const app = document.getElementById("app");
  const audio = document.getElementById("musica");
  const btnMusic = document.getElementById("musicControl");

  sobre.classList.add("abierto");

  if (CONFIG.evento.musica && audio.paused) {
    audio.play().then(() => {
      btnMusic.classList.add("reproduciendo");
    }).catch(e => console.log("Auto-play bloqueado:", e));
  }

  setTimeout(() => {
    entrada.classList.add("oculta");
    app.classList.add("visible");
    document.body.classList.remove("bloqueado");
    observarSecciones();
  }, 1600);
}

function abrirLightbox(src) {
  const lb = document.getElementById("lightbox");
  const img = document.getElementById("imgLightbox");
  img.src = src;
  lb.classList.add("visible");
  document.body.style.overflow = "hidden";
}

function cerrarLightboxFn() {
  const lb = document.getElementById("lightbox");
  lb.classList.remove("visible");
  document.body.style.overflow = "";
}

function mostrarToast(msg) {
  const toast = document.getElementById("toast");
  toast.textContent = msg;
  toast.classList.add("visible");
  setTimeout(() => toast.classList.remove("visible"), 3000);
}

function copiarAlPortapapeles(texto) {
  navigator.clipboard.writeText(texto).then(() => {
    mostrarToast("¡Copiado al portapapeles!");
  }).catch(() => {
    mostrarToast("Error al copiar");
  });
}

function observarSecciones() {
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add("visible");
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.1, rootMargin: "0px 0px -50px 0px" });

  document.querySelectorAll(".reveal").forEach(el => observer.observe(el));
}

function inicializar() {
  aplicarDiseno();
  renderizarMotivos();
  armarEntrada();
  armarHero();
  armarSecciones();
  crearEventos();
  crearDetalles();
  crearGaleria();
  iniciarCuenta();
  setupMusica();

  document.getElementById("abrirInvitacion").addEventListener("click", abrirInvitacion);
  document.getElementById("prevPhoto")?.addEventListener("click", () => { prevSlide(); resetAutoPlay(); });
  document.getElementById("nextPhoto")?.addEventListener("click", () => { sigSlide(); resetAutoPlay(); });
  document.getElementById("cerrarLightbox").addEventListener("click", cerrarLightboxFn);
  
  document.getElementById("cerrarGiftModal").addEventListener("click", () => {
    document.getElementById("giftModal").classList.remove("visible");
    document.body.style.overflow = "";
  });

  if (slidesCount > 1) resetAutoPlay();
}

document.addEventListener("DOMContentLoaded", inicializar);
</script>
</body>
</html>
