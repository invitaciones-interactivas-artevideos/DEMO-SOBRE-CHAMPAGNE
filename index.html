<style>
:root {
  --bg: #fff8f4;
  --surface: #ffffff;
  --surface-soft: #f8ece9;
  --ink: #2d2426;
  --heading: #6f3b31;
  --muted: #7d696c;
  --accent: #b86f79;
  --accent-2: #d7a77f;
  --accent-3: #738c74;
  --button-bg: #2d2426;
  --button-text: #ffffff;
  --line: rgba(45, 36, 38, 0.16);
  --shadow: rgba(45, 36, 38, 0.16);
  --glow: rgba(184, 111, 121, 0.22);
  --title-font: "Cormorant Garamond", serif;
  --script-font: "Parisienne", cursive;
  --body-font: "Jost", sans-serif;
  --title-size: 3rem;
  --body-size: 1rem;
  --button-font-size: 0.78rem;
  --button-radius: 999px;
  --button-padding-y: 0.92rem;
  --button-padding-x: 1.25rem;
  --section-space: 5.5rem;
  --content-width: 1040px;
  --hero-image-size: 245px;
  --hero-y: 0px;
  --hero-x: 0px;
  --deco-scale: 1;
  --envelope-w: min(82vw, 430px);
  --envelope-h: 270px;
  --envelope-color: #f6dfd8;
  --envelope-lining: #fff7f2;
  --seal-color: #b86f79;
  --seal-text: #fffdf9;
  --radius: 8px;
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;
  background:
    linear-gradient(120deg, rgba(255,255,255,0.72), transparent 34%),
    radial-gradient(circle at top left, var(--glow), transparent 30%),
    linear-gradient(180deg, var(--bg), var(--surface-soft));
  color: var(--ink);
  font-family: var(--body-font);
  font-size: var(--body-size);
  line-height: 1.65;
  overflow-x: hidden;
}

body.bloqueado {
  overflow: hidden;
}

button,
a {
  -webkit-tap-highlight-color: transparent;
}

img {
  max-width: 100%;
  display: block;
}

.entrada {
  position: fixed;
  inset: 0;
  z-index: 9000;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(circle at 18% 16%, rgba(255,255,255,0.88), transparent 24%),
    radial-gradient(circle at 84% 72%, var(--glow), transparent 30%),
    linear-gradient(145deg, var(--bg), var(--surface-soft) 62%, var(--surface));
  transition: opacity 0.8s ease, visibility 0.8s ease;
}

.entrada.oculta {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.entrada-deco {
  position: absolute;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.entrada-deco .motif {
  position: absolute;
  width: calc(210px * var(--deco-scale));
  color: var(--accent);
  opacity: 0.15;
  animation: flotar 8s ease-in-out infinite;
}

.entrada-deco .motif:nth-child(1) {
  top: 7%;
  left: 5%;
  transform: rotate(-18deg);
}

.entrada-deco .motif:nth-child(2) {
  right: 3%;
  bottom: 6%;
  color: var(--accent-2);
  animation-delay: -3s;
  transform: rotate(14deg);
}

.sobre-wrap {
  width: min(560px, 100%);
  text-align: center;
  position: relative;
}

.sobre-copy {
  margin-bottom: 24px;
  opacity: 0;
  animation: subir 0.9s ease 0.25s forwards;
}

.sobre-copy .mini {
  margin: 0 0 6px;
  color: var(--accent);
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

.sobre-copy h1 {
  margin: 0;
  font-family: var(--script-font);
  font-size: clamp(3rem, 14vw, 5.8rem);
  line-height: 0.9;
  color: var(--ink);
  font-weight: 400;
}

.sobre-copy p {
  margin: 12px auto 0;
  max-width: 360px;
  color: var(--muted);
}

.sobre {
  width: var(--envelope-w);
  height: var(--envelope-h);
  margin: 0 auto;
  position: relative;
  perspective: 1200px;
  filter: drop-shadow(0 26px 40px rgba(45, 36, 38, 0.24));
  animation: aparecerSobre 1s ease forwards;
}

.sobre-base,
.sobre-solapa,
.sobre-bolsillo,
.sobre-carta {
  position: absolute;
  inset: 0;
}

.sobre-base {
  border-radius: var(--radius);
  background:
    linear-gradient(145deg, rgba(255,255,255,0.42), transparent 34%),
    var(--envelope-color);
  border: 1px solid rgba(255,255,255,0.72);
}

.sobre-carta {
  width: 82%;
  height: 82%;
  left: 9%;
  top: 10%;
  border-radius: var(--radius);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.94), rgba(255,255,255,0.78)),
    var(--envelope-lining);
  border: 1px solid rgba(45,36,38,0.08);
  display: grid;
  place-items: center;
  padding: 24px;
  transform: translateY(10px);
  transition: transform 1s ease 0.22s;
  z-index: 4;
}

.sobre-carta span {
  display: block;
  font-family: var(--title-font);
  font-size: clamp(1.8rem, 9vw, 3rem);
  line-height: 1;
  color: var(--accent);
}

.sobre-carta small {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-size: 0.72rem;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.sobre-solapa {
  clip-path: polygon(0 0, 100% 0, 50% 62%);
  background:
    linear-gradient(180deg, rgba(255,255,255,0.52), transparent 54%),
    var(--envelope-color);
  border-radius: var(--radius);
  transform-origin: top center;
  transition: transform 0.95s cubic-bezier(.2,.72,.18,1), filter 0.95s ease;
  z-index: 5;
}

.sobre-bolsillo {
  z-index: 7;
}

.sobre-bolsillo::before,
.sobre-bolsillo::after {
  content: "";
  position: absolute;
  bottom: 0;
  width: 50.5%;
  height: 100%;
  background: var(--envelope-color);
}

.sobre-bolsillo::before {
  left: 0;
  clip-path: polygon(0 20%, 100% 57%, 100% 100%, 0 100%);
  border-bottom-left-radius: var(--radius);
}

.sobre-bolsillo::after {
  right: 0;
  clip-path: polygon(100% 20%, 0 57%, 0 100%, 100% 100%);
  border-bottom-right-radius: var(--radius);
}

.sello {
  position: absolute;
  z-index: 8;
  left: 50%;
  top: 54%;
  transform: translate(-50%, -50%);
  width: 92px;
  height: 92px;
  border: 0;
  border-radius: 50%;
  color: var(--seal-text);
  background:
    radial-gradient(circle at 35% 30%, rgba(255,255,255,0.36), transparent 24%),
    var(--seal-color);
  box-shadow:
    0 14px 26px rgba(45,36,38,0.22),
    inset 0 0 0 1px rgba(255,255,255,0.32),
    inset 0 0 0 8px rgba(255,255,255,0.08);
  cursor: pointer;
  display: grid;
  place-items: center;
  font-family: var(--title-font);
  font-size: 0.74rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transition: transform 0.25s ease, filter 0.25s ease;
}

.sello:hover {
  transform: translate(-50%, -50%) scale(1.04);
  filter: brightness(1.04);
}

.sobre.abierto .sobre-solapa {
  transform: rotateX(-180deg);
  filter: brightness(1.06);
  z-index: 1;
}

.sobre.abierto .sobre-carta {
  z-index: 6;
  transform: translateY(-138px);
}

.sobre.abierto .sello {
  transform: translate(-50%, -50%) scale(0.75);
  opacity: 0;
  pointer-events: none;
}

.app {
  min-height: 100vh;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.8s ease;
}

.app.visible {
  opacity: 1;
  visibility: visible;
}

.music-control {
  position: fixed;
  right: 18px;
  bottom: 18px;
  z-index: 5000;
  width: 50px;
  height: 50px;
  border: 1px solid rgba(255,255,255,0.72);
  border-radius: 50%;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  color: var(--accent);
  box-shadow: 0 14px 36px var(--shadow);
  display: grid;
  place-items: center;
  cursor: pointer;
  backdrop-filter: blur(16px);
}

.music-control svg {
  width: 22px;
  height: 22px;
}

.music-control.reproduciendo {
  color: var(--button-text);
  background: var(--button-bg);
}

.hero {
  position: relative;
  min-height: 96svh;
  padding: 48px 18px 82px;
  display: grid;
  align-items: center;
  overflow: hidden;
}

.hero::before {
  content: "";
  position: absolute;
  inset: 0;
  background:
    linear-gradient(90deg, color-mix(in srgb, var(--surface) 75%, transparent) 0 44%, transparent 44%),
    radial-gradient(circle at 78% 18%, var(--glow), transparent 28%);
  pointer-events: none;
}

.hero-grid {
  position: relative;
  z-index: 2;
  width: min(var(--content-width), 100%);
  margin: 0 auto;
  display: grid;
  grid-template-columns: 0.92fr 1.08fr;
  gap: clamp(28px, 6vw, 72px);
  align-items: center;
  transform: translate(var(--hero-x), var(--hero-y));
}

.portrait-stage {
  min-height: 470px;
  position: relative;
  display: grid;
  place-items: center;
}

.portrait-ring {
  width: min(var(--hero-image-size), 72vw);
  aspect-ratio: 1;
  border-radius: 50%;
  padding: 10px;
  background:
    conic-gradient(from 90deg, var(--accent), var(--accent-2), var(--accent-3), var(--accent));
  box-shadow: 0 28px 58px var(--shadow);
  position: relative;
  z-index: 2;
}

.portrait-ring::before {
  content: "";
  position: absolute;
  inset: -36px;
  border: 1px solid var(--line);
  border-radius: 46% 54% 50% 50%;
  transform: rotate(-12deg);
}

.portrait-ring::after {
  content: "";
  position: absolute;
  inset: -70px -48px;
  border: 1px solid color-mix(in srgb, var(--accent) 42%, transparent);
  border-radius: 55% 45% 46% 54%;
  transform: rotate(18deg);
}

.portrait-img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: 50%;
  background:
    linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--surface)), var(--surface-soft));
  border: 8px solid var(--surface);
}

.portrait-img[src=""] {
  display: none;
}

.portrait-fallback {
  position: absolute;
  inset: 18px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  text-align: center;
  padding: 26px;
  background:
    radial-gradient(circle at 30% 24%, rgba(255,255,255,0.82), transparent 34%),
    linear-gradient(135deg, var(--surface), var(--surface-soft));
  color: var(--accent);
  font-family: var(--script-font);
  font-size: clamp(4.8rem, 12vw, 7.2rem);
  line-height: 0.82;
}

.portrait-deco {
  position: absolute;
  width: calc(190px * var(--deco-scale));
  color: var(--accent);
  opacity: 0.95;
  pointer-events: none;
  z-index: 3;
}

.portrait-deco.deco-a {
  top: -30px;
  right: -50px;
  animation: flotar 6.5s ease-in-out infinite;
}

.portrait-deco.deco-b {
  left: -50px;
  bottom: -20px;
  width: calc(150px * var(--deco-scale));
  color: var(--accent-2);
  animation: flotar 7.4s ease-in-out -2s infinite;
  transform: rotate(-10deg);
}

.hero-copy {
  position: relative;
  text-align: center;
  padding-left: 0;
}

.eyebrow {
  margin: 0 0 12px;
  color: var(--accent);
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

.nombre {
  margin: 0;
  font-family: var(--script-font);
  font-size: clamp(4.2rem, 13vw, 8.2rem);
  line-height: 0.82;
  color: var(--ink);
  font-weight: 400;
}

.subtitulo {
  margin: 18px 0 0;
  font-family: var(--title-font);
  font-size: clamp(1.8rem, 4.4vw, 3.2rem);
  line-height: 1;
  color: var(--accent);
}

.hero-text {
  width: min(570px, 100%);
  margin: 24px auto 0 auto;
  color: var(--muted);
  font-size: clamp(1rem, 2.5vw, 1.16rem);
}

.hero-actions,
.button-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: center;
  justify-content: center;
  margin-top: 28px;
}

.btn {
  border: 1px solid color-mix(in srgb, var(--button-bg) 12%, transparent);
  border-radius: var(--button-radius);
  padding: var(--button-padding-y) var(--button-padding-x);
  min-height: 45px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  background: var(--button-bg);
  color: var(--button-text);
  box-shadow: 0 13px 30px color-mix(in srgb, var(--button-bg) 20%, transparent);
  cursor: pointer;
  text-decoration: none;
  font-family: var(--body-font);
  font-size: var(--button-font-size);
  font-weight: 700;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
}

.btn svg {
  width: 18px;
  height: 18px;
  flex: 0 0 auto;
}

.btn:hover {
  transform: translateY(-2px);
  filter: brightness(1.05);
  box-shadow: 0 17px 36px color-mix(in srgb, var(--button-bg) 24%, transparent);
}

.btn.secundario {
  color: var(--ink);
  background: color-mix(in srgb, var(--surface) 78%, transparent);
  border-color: var(--line);
  box-shadow: none;
}

.scroll-mark {
  position: absolute;
  left: 50%;
  bottom: 24px;
  z-index: 3;
  color: var(--accent);
  transform: translateX(-50%);
  animation: bounce 1.7s infinite;
}

.section {
  position: relative;
  padding: var(--section-space) 18px;
  overflow: hidden;
}

.section:nth-of-type(odd) {
  background: color-mix(in srgb, var(--surface) 78%, var(--bg));
}

.section-inner {
  width: min(var(--content-width), 100%);
  margin: 0 auto;
  position: relative;
  z-index: 1;
}

.section-head {
  max-width: 690px;
  margin: 0 auto 32px auto;
  text-align: center;
}

.section-kicker {
  margin: 0 0 10px;
  color: var(--accent);
  font-size: 0.72rem;
  font-weight: 800;
  letter-spacing: 0.22em;
  text-transform: uppercase;
}

h2 {
  margin: 0;
  font-family: var(--title-font);
  font-size: clamp(2.45rem, 7vw, var(--title-size));
  line-height: 0.98;
  color: var(--heading);
  font-weight: 600;
}

.lead {
  margin: 18px auto 0 auto;
  color: var(--muted);
  font-size: clamp(1rem, 2.5vw, 1.13rem);
}

.story {
  display: grid;
  grid-template-columns: 1fr;
  gap: clamp(24px, 6vw, 40px);
  align-items: center;
  text-align: center;
}

.quote-mark {
  font-family: var(--script-font);
  font-size: clamp(4.2rem, 10vw, 7rem);
  line-height: 0.78;
  color: var(--accent);
  text-align: center;
}

.story-panel {
  border-left: none;
  padding-left: 0;
  text-align: center;
}

.countdown-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-top: 26px;
}

.count-item,
.event-item,
.detail-item {
  background: color-mix(in srgb, var(--surface) 84%, transparent);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 18px 42px var(--shadow);
}

.count-item {
  min-height: 100px;
  padding: 20px 10px;
  display: grid;
  place-items: center;
  text-align: center;
}

.count-num {
  display: block;
  font-family: var(--title-font);
  font-size: clamp(2rem, 8vw, 4rem);
  line-height: 0.9;
  color: var(--accent);
}

.count-label {
  display: block;
  margin-top: 8px;
  color: var(--muted);
  font-size: 0.68rem;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
}

.event-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 16px;
}

.event-item {
  padding: clamp(24px, 5vw, 36px);
  min-height: auto;
  position: relative;
  overflow: hidden;
  text-align: center;
}

.event-item::after {
  content: "";
  position: absolute;
  right: -42px;
  bottom: -42px;
  width: 150px;
  height: 150px;
  border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  border-radius: 50%;
}

.event-title {
  margin: 0 0 18px;
  font-family: var(--title-font);
  font-size: clamp(2rem, 6vw, 3.1rem);
  color: var(--heading);
  line-height: 1;
}

.event-data {
  margin: 0 0 8px;
  color: var(--ink);
  font-weight: 600;
}

.event-address {
  margin: 0;
  color: var(--muted);
}

.detail-grid {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 24px;
}

.detail-item {
  flex: 1 1 300px;
  max-width: 420px;
  min-height: auto;
  padding: 24px;
  text-align: center;
}

.detail-icon {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  margin: 0 auto 18px auto;
  background: color-mix(in srgb, var(--accent) 14%, var(--surface));
  color: var(--accent);
}

.detail-icon svg {
  width: 23px;
  height: 23px;
}

.detail-item h3 {
  margin: 0 0 10px;
  font-family: var(--title-font);
  font-size: 2rem;
  line-height: 1;
  color: var(--heading);
}

.detail-item p {
  margin: 0;
  color: var(--muted);
}

.closing {
  min-height: 72vh;
  display: grid;
  align-items: center;
  text-align: center;
  background:
    radial-gradient(circle at 50% 20%, var(--glow), transparent 36%),
    linear-gradient(180deg, var(--surface), var(--bg));
}

.closing h2 {
  font-family: var(--script-font);
  font-weight: 400;
  color: var(--heading);
  font-size: clamp(3.6rem, 13vw, 7.4rem);
}

.closing .lead {
  margin-left: auto;
  margin-right: auto;
  max-width: 650px;
}

.deco-corner {
  position: absolute;
  pointer-events: none;
  width: calc(260px * var(--deco-scale));
  color: var(--accent);
  opacity: 0.11;
}

.deco-corner.left {
  left: -70px;
  top: 26px;
  transform: rotate(-14deg);
}

.deco-corner.right {
  right: -70px;
  bottom: 12px;
  color: var(--accent-2);
  transform: rotate(18deg);
}

.reveal {
  opacity: 0;
  transform: translateY(24px);
  transition: opacity 0.8s ease, transform 0.8s ease;
}

.reveal.visible {
  opacity: 1;
  transform: translateY(0);
}

.gift-modal {
  position: fixed;
  inset: 0;
  z-index: 7200;
  display: none;
  place-items: center;
  padding: 18px;
  background: rgba(20, 16, 18, 0.74);
  backdrop-filter: blur(14px);
}

.gift-modal.visible {
  display: grid;
}

.gift-panel {
  width: min(92vw, 520px);
  max-height: 86vh;
  overflow: auto;
  border-radius: var(--radius);

const $ = (id) => document.getElementById(id);

function textoSeguro(valor) {
  if (!valor) return "";
  return String(valor)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

function setText(id, valor) {
  const el = $(id);
  if (el) el.textContent = valor ?? "";
}

function cssVar(nombre, valor) {
  if (valor !== undefined && valor !== null && valor !== "") {
    document.documentElement.style.setProperty(nombre, valor);
  }
}

function whatsappLink(mensaje) {
  return `https://wa.me/${CONFIG.enlaces.whatsappNumero}?text=${encodeURIComponent(mensaje)}`;
}

function aplicarDiseno() {
  const paleta = PALETAS[CONFIG.diseno.paleta] || PALETAS.champagne_premium;
  const fuentes = FUENTES[CONFIG.diseno.fuentes] || FUENTES.editorial;
  cssVar("--bg", paleta.bg);
  cssVar("--surface", paleta.surface);
  cssVar("--surface-soft", paleta.surfaceSoft);
  cssVar("--ink", paleta.ink);
  cssVar("--heading", CONFIG.diseno.colorTitulos || paleta.heading);
  cssVar("--muted", paleta.muted);
  cssVar("--accent", paleta.accent);
  cssVar("--accent-2", paleta.accent2);
  cssVar("--accent-3", paleta.accent3);
  cssVar("--button-bg", paleta.buttonBg);
  cssVar("--button-text", paleta.buttonText);
  cssVar("--line", paleta.line);
  cssVar("--shadow", paleta.shadow);
  cssVar("--glow", paleta.glow);
  cssVar("--title-font", fuentes.title);
  cssVar("--script-font", fuentes.script);
  cssVar("--body-font", fuentes.body);
  cssVar("--title-size", CONFIG.diseno.tamañoTitulo);
  cssVar("--body-size", CONFIG.diseno.tamañoTexto);
  cssVar("--button-font-size", CONFIG.diseno.tamañoBoton);
  cssVar("--button-radius", CONFIG.diseno.bordeBoton);
  cssVar("--button-padding-y", CONFIG.diseno.altoBoton);
  cssVar("--button-padding-x", CONFIG.diseno.anchoBoton);
  cssVar("--radius", CONFIG.diseno.radioBordes);
  cssVar("--content-width", CONFIG.diseno.anchoContenido);
  cssVar("--section-space", CONFIG.diseno.espacioSecciones);
  cssVar("--hero-image-size", CONFIG.diseno.tamañoFotoPortada);
  cssVar("--hero-x", CONFIG.diseno.moverPortadaDerechaIzquierda);
  cssVar("--hero-y", CONFIG.diseno.moverPortadaArribaAbajo);
  cssVar("--deco-scale", CONFIG.diseno.tamañoDibujos);
  cssVar("--envelope-color", CONFIG.diseno.colorSobre);
  cssVar("--envelope-lining", CONFIG.diseno.interiorSobre);
  cssVar("--seal-color", CONFIG.diseno.colorLacre);
  cssVar("--seal-text", CONFIG.diseno.colorTextoLacre);
}

function aplicarMotivos() {
  const motivo = MOTIVOS[CONFIG.diseno.tema] || MOTIVOS.floral;
  const motivoChico = MOTIVOS[CONFIG.diseno.tema === "floral" ? "mariposas" : CONFIG.diseno.tema] || motivo;
  document.querySelectorAll("[data-motif]").forEach((el) => { el.innerHTML = motivo; });
  document.querySelectorAll("[data-motif-small]").forEach((el) => { el.innerHTML = motivoChico; });
  $("entradaDeco").innerHTML = `<div class="motif">${motivo}</div><div class="motif">${motivoChico}</div>`;
}

function aplicarTextos() {
  setText("entradaMini", CONFIG.evento.celebracion);
  setText("entradaNombre", CONFIG.evento.nombre);
  setText("entradaTexto", CONFIG.evento.textoPortada);
  setText("sobreInicial", CONFIG.evento.iniciales || CONFIG.evento.nombre.charAt(0));
  setText("sobreFecha", CONFIG.evento.fechaTexto);
  setText("heroEyebrow", CONFIG.evento.celebracion);
  setText("heroName", CONFIG.evento.nombre);
  setText("heroSubtitle", CONFIG.evento.frasePortada);
  setText("heroText", CONFIG.evento.textoInicio);
  $("heroPrimary").hidden = CONFIG.portada.mostrarBotonPrincipal === false;
  $("heroSecondary").hidden = CONFIG.portada.mostrarBotonSecundario === false;

  $("heroPrimary").innerHTML = `${ICONOS.flecha}<span>${textoSeguro(CONFIG.portada.textoBotonPrincipal)}</span>`;
  $("heroSecondary").innerHTML = `${ICONOS.flecha}<span>${textoSeguro(CONFIG.portada.textoBotonSecundario)}</span>`;
  
  setText("storyKicker", CONFIG.secciones.historiaKicker);
  setText("storyQuoteMark", "");
  setText("storyTitle", CONFIG.secciones.historiaTitulo);
  setText("storyText", CONFIG.secciones.historiaTexto);
  setText("countKicker", CONFIG.secciones.cuentaKicker);
  setText("countTitle", CONFIG.secciones.cuentaTitulo);
  setText("countText", CONFIG.secciones.cuentaTexto);
  setText("eventKicker", CONFIG.secciones.eventoKicker);
  setText("eventTitle", CONFIG.secciones.eventoTitulo);
  setText("eventText", CONFIG.secciones.eventoTexto);
  
  setText("closingKicker", CONFIG.secciones.cierreKicker);
  setText("closingTitle", CONFIG.secciones.cierreTitulo);
  setText("closingText", CONFIG.evento.textoCierre);
}

function aplicarPortada() {
  const img = $("coverImage");
  const fallback = $("coverFallback");
  fallback.textContent = CONFIG.evento.iniciales || CONFIG.evento.nombre.charAt(0);
  const modo = CONFIG.portada.modoCirculo || (CONFIG.portada.usarFoto ? "foto" : "inicial");
  const foto = CONFIG.portada.fotoCirculo || CONFIG.portada.foto;
  if (modo !== "foto" || !foto) {
    img.removeAttribute("src");
    img.style.display = "none";
    fallback.hidden = false;
    return;
  }
  img.src = foto;
  img.style.objectPosition = CONFIG.portada.posicionFoto || "center center";
  img.onload = () => { img.style.display = "block"; fallback.hidden = true; };
  img.onerror = () => { img.style.display = "none"; fallback.hidden = false; };
}

function crearEventos() {
  const grid = $("eventGrid");
  const eventos = CONFIG.eventos ? Object.values(CONFIG.eventos) : (CONFIG.lugares || []);
  grid.innerHTML = "";
  eventos.filter((lugar) => lugar.mostrar).forEach((lugar) => {
    const item = document.createElement("article");
    item.className = "event-item";
    
    // Se inserta icono si el título hace referencia a 'fiesta'
    let iconoHtml = "";
    if (lugar.titulo.toLowerCase().includes("fiesta")) {
      iconoHtml = `<div class="detail-icon">${ICONOS.fiesta}</div>`;
    }

    item.innerHTML = `
      ${iconoHtml}
      <h3 class="event-title">${textoSeguro(lugar.titulo)}</h3>
      <p class="event-data">${textoSeguro(lugar.fecha)} · ${textoSeguro(lugar.hora)}</p>
      <p class="event-data">${textoSeguro(lugar.lugar)}</p>
      <p class="event-address">${textoSeguro(lugar.direccion)}</p>
      <div class="button-row">
        <a class="btn secundario" href="${textoSeguro(lugar.mapa)}">${ICONOS.mapa}<span>Ver ubicación</span></a>
      </div>`;
    const enlaceMapa = item.querySelector("a");
    if (enlaceMapa) {
      enlaceMapa.addEventListener("pointerdown", guardarEstadoInvitacionAbierta);
      enlaceMapa.addEventListener("touchstart", guardarEstadoInvitacionAbierta, { passive: true });
      enlaceMapa.addEventListener("click", (event) => abrirMapaSinCerrarInvitacion(event, lugar));
    }
    grid.appendChild(item);
  });
}

function crearDetalles() {
  const gridDress = $("gridDresscode");
  gridDress.innerHTML = `
    <article class="detail-item">
      <div class="detail-icon">${ICONOS.vestir}</div>
      <h3>${textoSeguro(CONFIG.dressCode.titulo)}</h3>
      <p>${textoSeguro(CONFIG.dressCode.texto)}</p>
    </article>
  `;

  const gridAsist = $("gridAsistencia");
  const asistLink = (CONFIG.asistencia && CONFIG.asistencia.link) ? CONFIG.asistencia.link : whatsappLink(CONFIG.enlaces.whatsappMensaje);
  const asistTexto = (CONFIG.asistencia && CONFIG.asistencia.textoBoton) ? CONFIG.asistencia.textoBoton : "Confirmar";

  let asistHtml = `
    <article class="detail-item">
      <div class="detail-icon">${ICONOS.whatsapp}</div>
      <h3>Confirmación</h3>
      <p>Avisame si vas a acompañarme para preparar todo con mucho cariño.</p>
      <div class="button-row">
        <a class="btn secundario" href="${textoSeguro(asistLink)}" target="_blank" rel="noopener">${textoSeguro(asistTexto)}</a>
      </div>
    </article>
  `;

  if (CONFIG.playlist && CONFIG.playlist.mostrar) {
    asistHtml += `
      <article class="detail-item">
        <div class="detail-icon">${ICONOS.musica}</div>
        <h3>Playlist</h3>
        <p>${textoSeguro(CONFIG.playlist.texto)}</p>
        <div class="button-row">
          <a class="btn secundario" href="${textoSeguro(CONFIG.playlist.link)}" target="_blank" rel="noopener">Sugerir canción</a>
        </div>
      </article>
    `;
  }
  gridAsist.innerHTML = asistHtml;

  const gridAlbum = $("gridAlbum");
  if (CONFIG.album && CONFIG.album.mostrar) {
    gridAlbum.innerHTML = `
      <article class="detail-item">
        <div class="detail-icon">${ICONOS.camara}</div>
        <h3>${textoSeguro(CONFIG.album.titulo)}</h3>
        <p>${textoSeguro(CONFIG.album.texto)}</p>
        <div class="button-row">
          <a class="btn secundario" href="${textoSeguro(CONFIG.album.link)}" target="_blank" rel="noopener">${textoSeguro(CONFIG.album.boton)}</a>
        </div>
      </article>
    `;
    $("album").style.display = "block";
  } else {
    $("album").style.display = "none";
  }

  const gridRegalos = $("gridRegalos");
  if (CONFIG.regalo && CONFIG.regalo.mostrar) {
    gridRegalos.innerHTML = `
      <article class="detail-item">
        <div class="detail-icon">${ICONOS.regalo}</div>
        <h3>Regalo</h3>
        <p>${textoSeguro(CONFIG.regalo.textoSeccion)}</p>
        <div class="button-row">
          <button class="btn secundario" type="button" onclick="abrirRegalo()">Consultar datos</button>
        </div>
      </article>
    `;
    $("regalos").style.display = "block";
  } else {
    $("regalos").style.display = "none";
  }
}

function configurarRegalo() {
  if (!CONFIG.regalo) return;
  setText("giftKicker", "Regalo");
  setText("giftTitle", CONFIG.regalo.titulo);
  setText("giftIntro", CONFIG.regalo.textoModal);
  const filas = [
    { etiqueta: "Cuenta bancaria", valor: CONFIG.regalo.cuentaBancaria },
    { etiqueta: "Nombre del titular", valor: CONFIG.regalo.titular },
    { etiqueta: "Número de cuenta", valor: CONFIG.regalo.numerodecuenta },
    { etiqueta: "CI", valor: CONFIG.regalo.ci },
    ...(CONFIG.regalo.datosExtra || [])
  ].filter((dato) => dato && dato.mostrar !== false && dato.valor);

  $("giftData").innerHTML = filas.map((dato) => `
    <div class="gift-row">
      <span class="gift-label">${textoSeguro(dato.etiqueta)}</span>
      <span class="gift-value">${textoSeguro(dato.valor)}</span>
    </div>
  `).join("");
}

function abrirRegalo() {
  configurarRegalo();
  $("giftModal").classList.add("visible");
  history.pushState({ ...(history.state || {}), invitacionAbierta: true, modal: "regalo" }, null, "#regalo");
}

function cerrarRegalo() {
  const modal = $("giftModal");
  if (modal.classList.contains("visible")) {
    modal.classList.remove("visible");
    if (location.hash === "#regalo") {
      history.back();
    }
  }
}

function mostrarToast(mensaje) {
  const toast = $("toast");
  toast.textContent = mensaje;
  toast.classList.add("visible");
  setTimeout(() => toast.classList.remove("visible"), 2300);
}

let contadorIntervalo;
const HASH_REGALO = "#regalo";
const STORAGE_INVITACION_ABIERTA = "invitacionAbierta";
let mapaAbiertoPorHistorial = false;

function guardarEstadoInvitacionAbierta() {
  try {
    sessionStorage.setItem(STORAGE_INVITACION_ABIERTA, "1");
  } catch (error) {}

  try {
    history.replaceState({ ...(history.state || {}), invitacionAbierta: true }, "", window.location.href);
  } catch (error) {}
}

function invitacionEstabaAbierta() {
  try {
    if (sessionStorage.getItem(STORAGE_INVITACION_ABIERTA) === "1") return true;
  } catch (error) {}

  return Boolean(history.state && history.state.invitacionAbierta);
}

function mostrarInvitacionAbierta() {
  $("sobre").classList.add("abierto");
  $("entrada").classList.add("oculta");
  $("app").classList.add("visible");
  document.body.classList.remove("bloqueado");
}

function restaurarInvitacionSiCorresponde() {
  if (invitacionEstabaAbierta()) mostrarInvitacionAbierta();
}

function mapaEmbedUrl(lugar) {
  const consulta = [lugar.lugar, lugar.direccion].filter(Boolean).join(", ");
  return `https://maps.google.com/maps?q=${encodeURIComponent(consulta)}&output=embed`;
}

function abrirMapaSinCerrarInvitacion(event) {
  guardarEstadoInvitacionAbierta();

  if (
    event.defaultPrevented ||
    event.button !== 0 ||
    event.metaKey ||
    event.ctrlKey ||
    event.shiftKey ||
    event.altKey
  ) {
    return;
  }

  event.preventDefault();
  
  // Guardamos la URL del mapa
  const urlMapa = event.currentTarget.href;

  // Forzamos la apertura usando un enlace temporal con _system para forzar al navegador externo de WhatsApp
  const linkTemporal = document.createElement('a');
  linkTemporal.href = urlMapa;
  linkTemporal.target = '_blank';
  linkTemporal.rel = 'noopener noreferrer';
  document.body.appendChild(linkTemporal);
  linkTemporal.click();
  document.body.removeChild(linkTemporal);

  // Aseguramos que la invitación mantenga su estado visible por si el usuario vuelve inmediatamente
  setTimeout(() => {
    restaurarInvitacionSiCorresponde();
  }, 300);
}

function cerrarMapa(desdePopState = false) {
  const modal = $("mapModal");
  if (!modal.classList.contains("visible")) return;

  modal.classList.remove("visible");
  $("mapFrame").src = "";

  if (mapaAbiertoPorHistorial && !desdePopState) {
    mapaAbiertoPorHistorial = false;
    history.back();
  } else {
    mapaAbiertoPorHistorial = false;
  }
}

function actualizarCuenta() {
  const objetivo = new Date(CONFIG.evento.fechaCuentaRegresiva).getTime();
  const restante = objetivo - Date.now();

  if (restante <= 0) {
    const contenedor = $("countdownContainer");
    if(contenedor) {
      contenedor.innerHTML = `<h3 style="font-family: var(--title-font); font-size: clamp(2rem, 8vw, 3.5rem); color: var(--accent); margin: 0; text-align: center; width: 100%;">¡Llegó el gran día!</h3>`;
      contenedor.style.display = "block";
    }
    if(contadorIntervalo) clearInterval(contadorIntervalo);
    return;
  }

  const dias = Math.floor(restante / 86400000);
  const horas = Math.floor((restante % 86400000) / 3600000);
  const minutos = Math.floor((restante % 3600000) / 60000);
  const segundos = Math.floor((restante % 60000) / 1000);
  
  if($("days")) setText("days", String(dias).padStart(2, "0"));
  if($("hours")) setText("hours", String(horas).padStart(2, "0"));
  if($("minutes")) setText("minutes", String(minutos).padStart(2, "0"));
  if($("seconds")) setText("seconds", String(segundos).padStart(2, "0"));
}

function configurarMusica() {
  const musica = $("musica");
  musica.src = CONFIG.musica.archivo;
  musica.volume = Math.min(Math.max(Number(CONFIG.musica.volumen || 0.7), 0), 1);
  $("musicControl").innerHTML = ICONOS.musica;
  $("musicControl").addEventListener("click", alternarMusica);
  musica.addEventListener("play", () => $("musicControl").classList.add("reproduciendo"));
  musica.addEventListener("pause", () => $("musicControl").classList.remove("reproduciendo"));
}

function intentarMusica() {
  if (!CONFIG.musica.intentarAutoplay) return;
  $("musica").play().catch(() => {});
}

function alternarMusica() {
  const musica = $("musica");
  if (musica.paused) {
    musica.play().catch(() => mostrarToast("Tocá nuevamente para activar la música."));
  } else {
    musica.pause();
  }
}

function abrirInvitacion() {
  guardarEstadoInvitacionAbierta();
  $("sobre").classList.add("abierto");
  intentarMusica();
  
  setTimeout(() => {
    $("entrada").classList.add("oculta");
    $("app").classList.add("visible");
    document.body.classList.remove("bloqueado");
    window.scrollTo({ top: 0, behavior: "auto" });
  }, 1050);
}

function prepararRevelado() {
  const obs = new IntersectionObserver((entradas) => {
    entradas.forEach((entrada) => {
      if (entrada.isIntersecting) entrada.target.classList.add("visible");
    });
  }, { threshold: 0.16 });
  document.querySelectorAll(".reveal").forEach((el) => obs.observe(el));
}

function iniciar() {
  aplicarDiseno();
  aplicarMotivos();
  aplicarTextos();
  aplicarPortada();
  crearEventos();
  crearDetalles();
  configurarRegalo();
  configurarMusica();
  actualizarCuenta();
  prepararRevelado();
  contadorIntervalo = setInterval(actualizarCuenta, 1000);

  $("abrirInvitacion").addEventListener("click", abrirInvitacion);
  $("closeGift").addEventListener("click", cerrarRegalo);
  $("closeMap").addEventListener("click", () => cerrarMapa());

  $("giftModal").addEventListener("click", (event) => {
    if (event.target.id === "giftModal") cerrarRegalo();
  });

  $("mapModal").addEventListener("click", (event) => {
    if (event.target.id === "mapModal") cerrarMapa();
  });

  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
      cerrarRegalo();
      cerrarMapa();
    }
  });

  window.addEventListener("popstate", () => {
    const modal = $("giftModal");
    if (modal && modal.classList.contains("visible") && location.hash !== HASH_REGALO) {
      modal.classList.remove("visible");
    }
    cerrarMapa(true);
    restaurarInvitacionSiCorresponde();
  });

  window.addEventListener("pageshow", restaurarInvitacionSiCorresponde);
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) restaurarInvitacionSiCorresponde();
  });

  restaurarInvitacionSiCorresponde();
}

document.addEventListener("DOMContentLoaded", iniciar);
</script>
